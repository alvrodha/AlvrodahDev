<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <!-- @include head -->
    <title data-i18n="meta.library.title">UI Component Library — Copyable HTML &amp; CSS Snippets | alvrodahDev</title>
    <meta name="description" data-i18n-attr="content:meta.library.description" content="Free, copyable HTML, CSS and JavaScript UI snippets with live previews: animated backgrounds, login card, glow buttons and more.">
    <link rel="canonical" href="%SITE_URL%/library/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="%SITE_URL%/library/">
    <meta property="og:title" content="UI Component Library — Copyable Snippets">
    <meta property="og:description" content="Copyable HTML, CSS and JavaScript UI snippets with live previews.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "UI Component Library",
        "url": "%SITE_URL%/library/",
        "isPartOf": { "@id": "%SITE_URL%/#website" },
        "breadcrumb": {
            "@type": "BreadcrumbList",
            "itemListElement": [
                { "@type": "ListItem", "position": 1, "name": "Home", "item": "%SITE_URL%/" },
                { "@type": "ListItem", "position": 2, "name": "Library", "item": "%SITE_URL%/library/" }
            ]
        }
    }
    </script>
</head>
<body class="bg-raw-bg text-raw-text font-sans antialiased" data-page="library">
    <!-- @include header -->

    <main id="main" class="py-16 md:py-20 border-b border-raw-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-8 border-b border-raw-border pb-6">
                <p class="font-mono text-xs text-raw-accent uppercase tracking-widest" data-i18n="library.kicker">// 02. COPY, ADAPT, BUILD</p>
                <h1 class="text-4xl sm:text-6xl font-extrabold text-raw-strong mt-1" data-i18n="library.title">COMPONENT LIBRARY</h1>
                <p class="font-mono text-sm text-raw-dim mt-4 max-w-2xl" data-i18n="library.text">Small interface experiments and starter snippets to copy into your own projects. These are examples to adapt, not production-ready packages.</p>
            </div>

            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-8">
                <div id="component-filters" class="flex flex-wrap gap-2 font-mono text-xs" role="group" data-i18n-attr="aria-label:library.filterLabel" aria-label="Filter components">
                    <button type="button" class="component-filter is-active" data-filter="all" aria-pressed="true" data-i18n="library.filters.all">ALL</button>
                    <button type="button" class="component-filter" data-filter="background" aria-pressed="false" data-i18n="library.filters.background">BACKGROUNDS</button>
                    <button type="button" class="component-filter" data-filter="ui" aria-pressed="false" data-i18n="library.filters.ui">UI</button>
                    <button type="button" class="component-filter" data-filter="animation" aria-pressed="false" data-i18n="library.filters.animation">ANIMATION</button>
                </div>
                <label class="font-mono text-xs text-raw-dim">
                    <span class="sr-only" data-i18n="library.searchLabel">Search components</span>
                    <input id="component-search" type="search" maxlength="80" data-i18n-attr="placeholder:library.searchPlaceholder" placeholder="Search snippets..." class="w-full sm:w-64 bg-raw-bg border border-raw-border px-3 py-2 text-raw-strong focus:border-raw-accent focus:outline-none">
                </label>
            </div>

            <p id="component-results" class="font-mono text-xs text-raw-dim mb-4" aria-live="polite"></p>
            <div id="component-grid" class="component-grid"></div>
        </div>
    </main>

    <!-- @include footer -->
</body>
</html>
