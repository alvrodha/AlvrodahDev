    <footer class="py-8 bg-raw-deep border-t border-raw-border font-mono text-xs text-raw-dim">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© %YEAR% <span class="text-raw-strong font-bold">%SITE_NAME%</span>. <span data-i18n="footer.rights">All rights reserved.</span></p>
            <nav data-i18n-attr="aria-label:footer.label" aria-label="Footer">
                <ul class="flex flex-wrap justify-center gap-6">
                    <li><a href="/" class="hover:text-raw-accent" data-i18n="nav.home">HOME</a></li>
                    <li><a href="/about/" class="hover:text-raw-accent" data-i18n="nav.about">ABOUT</a></li>
                    <li><a href="/library/" class="hover:text-raw-accent" data-i18n="nav.library">LIBRARY</a></li>
                    <li><a href="/blog/" class="hover:text-raw-accent" data-i18n="nav.blog">BLOG</a></li>
                    <li><a href="/feed.xml" class="hover:text-raw-accent">RSS</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    <!-- Theme customizer (opened from the top bar). Logic: src/ui/theme-dialog.js -->
    <dialog id="theme-dialog" class="theme-dialog" aria-labelledby="theme-dialog-title">
        <form method="dialog" class="p-6 space-y-6 font-mono text-sm">
            <div class="flex items-start justify-between gap-4 border-b border-raw-border pb-4">
                <div>
                    <p class="text-xs text-raw-accent uppercase tracking-widest" data-i18n="theme.kicker">// APPEARANCE</p>
                    <h2 id="theme-dialog-title" class="font-sans text-2xl font-extrabold text-raw-strong mt-1" data-i18n="theme.title">Customize colors</h2>
                    <p class="text-xs text-raw-dim mt-2" data-i18n="theme.intro">Pick a preset or build your own. Your choice is saved on this device.</p>
                </div>
                <button type="submit" value="close" class="p-1 text-raw-dim hover:text-raw-accent" data-i18n-attr="aria-label:theme.close" aria-label="Close">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <fieldset>
                <legend class="text-xs text-raw-dim uppercase mb-3" data-i18n="theme.presetsLabel">Presets</legend>
                <div id="theme-presets" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </fieldset>

            <fieldset class="border-t border-raw-border pt-5 space-y-4">
                <legend class="text-xs text-raw-dim uppercase mb-3 float-left w-full" data-i18n="theme.customLabel">Custom</legend>
                <div class="flex flex-wrap gap-4 clear-both" role="radiogroup" data-i18n-attr="aria-label:theme.base" aria-label="Base">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="theme-base" value="dark" class="accent-raw-accent">
                        <span data-i18n="theme.dark">Dark base</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="theme-base" value="light" class="accent-raw-accent">
                        <span data-i18n="theme.light">Light base</span>
                    </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="color-field flex items-center gap-3">
                        <input type="color" id="theme-accent" value="#ccff00">
                        <span data-i18n="theme.accent">Primary accent</span>
                    </label>
                    <label class="color-field flex items-center gap-3">
                        <input type="color" id="theme-accent2" value="#ff3366">
                        <span data-i18n="theme.accent2">Secondary accent</span>
                    </label>
                </div>
                <p id="theme-contrast" class="text-xs text-raw-dim" role="status" aria-live="polite"></p>
            </fieldset>

            <div class="flex flex-wrap items-center justify-between gap-3 border-t border-raw-border pt-5">
                <button type="button" id="theme-reset" class="btn-secondary !py-2 !px-4">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span data-i18n="theme.reset">Reset to default</span>
                </button>
                <button type="submit" value="done" class="btn-primary !py-2 !px-4" data-i18n="theme.done">Done</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
