<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <!-- @include head -->
    <title data-i18n="meta.contact.title">Contact Álvaro (alvrodah) — Junior Developer | alvrodahDev</title>
    <meta name="description" data-i18n-attr="content:meta.contact.description" content="Get in touch with Álvaro (alvrodah) about junior developer roles, freelance web projects, or collaborations.">
    <link rel="canonical" href="%SITE_URL%/contact/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="%SITE_URL%/contact/">
    <meta property="og:title" content="Contact Álvaro (alvrodah)">
    <meta property="og:description" content="Junior developer roles, freelance web projects, or collaborations.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "url": "%SITE_URL%/contact/",
        "isPartOf": { "@id": "%SITE_URL%/#website" },
        "mainEntity": { "@id": "%SITE_URL%/#person" }
    }
    </script>
</head>
<body class="bg-raw-bg text-raw-text font-sans antialiased" data-page="contact">
    <!-- @include header -->

    <main id="main" class="py-16 md:py-20 border-b border-raw-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                <div class="lg:col-span-5 space-y-6">
                    <p class="font-mono text-xs text-raw-accent uppercase tracking-widest" data-i18n="contact.kicker">// 05. INITIALIZE CONNECTION</p>
                    <h1 class="text-4xl sm:text-5xl font-extrabold text-raw-strong" data-i18n="contact.title">LET'S BUILD AND LEARN.</h1>
                    <p class="font-mono text-sm text-raw-dim leading-relaxed" data-i18n="contact.text">I'm interested in opportunities to keep learning, contribute to a team, and build useful software together.</p>

                    <ul class="space-y-4 font-mono text-sm pt-4 border-t border-raw-border">
                        <li class="flex flex-wrap items-center gap-3">
                            <i data-lucide="mail" class="w-5 h-5 text-raw-accent"></i>
                            <span class="text-raw-dim">EMAIL:</span>
                            <a href="mailto:%SITE_EMAIL%" class="text-raw-strong hover:text-raw-accent underline">%SITE_EMAIL%</a>
                        </li>
                        <li class="flex flex-wrap items-center gap-3">
                            <i data-lucide="github" class="w-5 h-5 text-raw-accent"></i>
                            <span class="text-raw-dim">GITHUB:</span>
                            <a href="%SITE_GITHUB%" target="_blank" rel="noopener noreferrer me" class="text-raw-strong hover:text-raw-accent underline">github.com/alvrodha</a>
                        </li>
                        <li class="flex flex-wrap items-center gap-3">
                            <i data-lucide="linkedin" class="w-5 h-5 text-raw-accent"></i>
                            <span class="text-raw-dim">LINKEDIN:</span>
                            <a href="%SITE_LINKEDIN%" target="_blank" rel="noopener noreferrer me" class="text-raw-strong hover:text-raw-accent underline">linkedin.com/in/alvrodah</a>
                        </li>
                    </ul>
                </div>

                <div class="lg:col-span-7">
                    <form id="contact-form" class="border border-raw-border bg-raw-panel p-6 sm:p-8 space-y-6 shadow-brutal" novalidate>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 font-mono text-xs">
                            <div>
                                <label for="contact-name" class="block text-raw-dim mb-2 uppercase" data-i18n="contact.form.name">// YOUR_NAME</label>
                                <input id="contact-name" name="name" type="text" required maxlength="100" autocomplete="name" class="w-full bg-raw-bg border border-raw-border p-3 text-raw-strong font-mono focus:border-raw-accent focus:outline-none" data-i18n-attr="placeholder:contact.form.namePlaceholder" placeholder="John Doe">
                            </div>
                            <div>
                                <label for="contact-email" class="block text-raw-dim mb-2 uppercase" data-i18n="contact.form.email">// YOUR_EMAIL</label>
                                <input id="contact-email" name="email" type="email" required maxlength="254" autocomplete="email" class="w-full bg-raw-bg border border-raw-border p-3 text-raw-strong font-mono focus:border-raw-accent focus:outline-none" placeholder="john@example.com">
                            </div>
                        </div>

                        <div class="font-mono text-xs">
                            <label for="contact-scope" class="block text-raw-dim mb-2 uppercase" data-i18n="contact.form.scope">// PROJECT_SCOPE</label>
                            <select id="contact-scope" name="scope" class="w-full bg-raw-bg border border-raw-border p-3 text-raw-strong font-mono focus:border-raw-accent focus:outline-none">
                                <option value="web" data-i18n="contact.form.scopes.web">Web development project</option>
                                <option value="backend" data-i18n="contact.form.scopes.backend">Backend or API project</option>
                                <option value="ui" data-i18n="contact.form.scopes.ui">Reusable UI or component work</option>
                                <option value="other" data-i18n="contact.form.scopes.other">Collaboration or other</option>
                            </select>
                        </div>

                        <div class="font-mono text-xs">
                            <label for="contact-message" class="block text-raw-dim mb-2 uppercase" data-i18n="contact.form.message">// TRANSMISSION_BODY</label>
                            <textarea id="contact-message" name="message" rows="5" required maxlength="5000" class="w-full bg-raw-bg border border-raw-border p-3 text-raw-strong font-mono focus:border-raw-accent focus:outline-none" data-i18n-attr="placeholder:contact.form.messagePlaceholder" placeholder="Describe the project scope, timeline, and requirements..."></textarea>
                        </div>

                        <button type="submit" class="btn-primary w-full !py-4" data-i18n="contact.form.submit">SEND_TRANSMISSION()</button>

                        <p id="form-status" class="font-mono text-xs text-center p-3 border border-raw-accent bg-raw-accent/10 text-raw-accent" role="status" aria-live="polite" hidden></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- @include footer -->
</body>
</html>
